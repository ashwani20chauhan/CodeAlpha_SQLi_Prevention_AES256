<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLi Prevention & AES-256 Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background: linear-gradient(rgba(2, 6, 23, 0.88), rgba(2, 6, 23, 0.95)), 
                        url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #e2e8f0; min-height: 100vh; padding: 40px 20px; margin: 0;
        }
        .wrapper { max-width: 780px; margin: 0 auto; }
        .main-header { text-align: center; margin-bottom: 36px; }
        .shield-icon { width: 64px; height: 64px; background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
        h2 { color: #10b981; font-size: 32px; font-weight: 700; margin: 0; text-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .box { 
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 30px; border-radius: 24px; margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.1);
        }
        .box:hover { border-color: #10b981; box-shadow: 0 0 50px rgba(16, 185, 129, 0.2); }
        .box-title { display: flex; align-items: center; gap: 12px; margin-top: 0; color: #f3f4f6; font-size: 20px; }
        input { width: 100%; padding: 14px 18px; margin: 10px 0 18px; background: rgba(2, 6, 23, 0.7); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #10b981; box-shadow: 0 0 18px rgba(16, 185, 129, 0.3); }
        button { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 14px; font-weight: 600; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4); font-size: 15px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6); }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        pre { background: rgba(2, 6, 23, 0.9); color: #34d399; padding: 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); overflow-x: auto; font-family: monospace; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="main-header">
            <div class="shield-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <h2>AES-256 & SQLi Protection Vault</h2>
            <span style="color: #94a3b8; font-size: 14px;">SQL Injection Neutralization & Double-Layer Cryptography Protocol</span>
        </div>

        <div class="box">
            <h3 class="box-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                1. Encrypt Data (AES-256 Standard)
            </h3>
            <input type="text" id="regUser" placeholder="Enter Username (e.g. ashwani)">
            <input type="text" id="regSecret" placeholder="Enter Confidential Data (e.g. Card / Secret Key)">
            <button onclick="registerUser()">Encrypt & Store to DB</button>
            <p id="regResult" style="margin-top: 14px; font-weight: 600;"></p>
        </div>

        <div class="box">
            <h3 class="box-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                2. SQL Injection Attack Defense Sandbox
            </h3>
            <p style="font-size: 13px; color: #9ca3af;">Try SQL Injection attack payload: <code>admin' OR '1'='1</code></p>
            <input type="text" id="searchUser" placeholder="Enter username to query database...">
            <button onclick="searchUser()">Run Safe Query Search</button>
            
            <div id="searchResults" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        async function registerUser() {
            const username = document.getElementById('regUser').value;
            const secret = document.getElementById('regSecret').value;
            const formData = new FormData();
            formData.append('username', username);
            formData.append('secret', secret);

            const res = await fetch('/register', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('regResult').innerText = data.message;
            document.getElementById('regResult').style.color = res.status === 201 ? '#34d399' : '#f87171';
        }

        async function searchUser() {
            const username = document.getElementById('searchUser').value;
            const formData = new FormData();
            formData.append('username', username);

            const res = await fetch('/login_secure', { method: 'POST', body: formData });
            const data = await res.json();
            
            const div = document.getElementById('searchResults');
            let attackMsg = data.sqli_attack_blocked ? `<span class="badge danger">🚨 Attack Intercepted: SQL Injection Neutralized!</span>` : `<span class="badge success">✓ Clean Query Executed Safely</span>`;

            if (res.status === 200) {
                div.innerHTML = `
                    ${attackMsg}<br>
                    <div style="margin-top: 10px;">
                        <b>User Identity:</b> ${data.user}<br><br>
                        <b>AES-256 Ciphertext (Stored in DB):</b>
                        <pre>${data.encrypted_data_db}</pre>
                        <b>Decrypted Secret Data:</b> <span style="color: #34d399; font-weight: 600;">${data.decrypted_secret}</span>
                    </div>
                `;
            } else {
                div.innerHTML = `
                    ${attackMsg}<br>
                    <div style="color:#f87171; margin-top: 10px; font-weight: 600;">Status: ${data.message}</div>
                `;
            }
        }
    </script>
</body>
</html>
